# Filehub — bind to loopback only; put Nginx Proxy Manager in front.
# First boot: if ADMIN_PASSWORD is unset, the entrypoint writes random
# ADMIN_PASSWORD + SESSION_SECRET once to:
#   ./data/admin-credentials.txt  (read this for the password)
#   ./data/.env
# Existing files are never overwritten.
services:
  filehub:
    build: .
    container_name: nas-filehub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      # Optional — leave unset on first install to auto-generate into ./data/
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SECURE_COOKIES: "true"
      DATA_ROOT: /data/files
      DB_PATH: /data/filehub.db
      THUMB_CACHE_DIR: /data/thumbs
      THUMB_ENABLE: "true"
      THUMB_VAAPI: "false"
      # auto|off|vaapi|nvdec — empty defers to THUMB_VAAPI (true acts as auto)
      THUMB_HWACCEL: ${THUMB_HWACCEL:-}
      # Host UID/GID for /data (default 1000:1000). Optional UMASK e.g. 002.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # UMASK: ${UMASK:-}
      LOGIN_RATE_LIMIT: "10"
      # TRUSTED_PROXIES: "10.0.0.0/8"
      # PUBLIC_BASE_URL: https://filehub.example.com
      # LOGIN_LOCKOUT_LIMIT: "10"
      # LOGIN_LOCKOUT_MINUTES: "15"
      MAX_UPLOAD_MB: "4096"
      CREDENTIALS_FILE: /data/admin-credentials.txt
      DOTENV_FILE: /data/.env
    volumes:
      - ./data:/data
    # Unraid Intel Quick Sync (J4125) — uncomment when deploying:
    # devices:
    #   - /dev/dri:/dev/dri
